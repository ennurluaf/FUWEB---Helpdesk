<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Helpdesk</title>
    <style>
      body {
        font: 18px/1.6 system-ui;
        max-width: 800px;
        margin: 40px auto;
        padding: 20px;
        background: #f7f8fc;
        color: #293443;
      }
      h1 {
        font-size: 2.4rem;
        margin-bottom: 0;
        background: #293443;
        color: #f7f8fc;
        width: 100%;
      }
      button {
        font: inherit;
        padding: 10px 18px;
      }
      li {
        margin: 12px 0;
      }
    </style>
  </head>
  <body>
    <h1>Campus helpdesk</h1>
    <p>Support tickets for our school.</p>
    <button id="load" type="button">Load tickets</button>
    <p id="statusLbl" role="status"></p>
    <ul id="tickets"></ul>
    <script src="app.js"></script>
  </body>
</html>
